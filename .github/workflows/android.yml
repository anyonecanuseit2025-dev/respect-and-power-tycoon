name: Android CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Automatically searches your repo for build files and builds them safely
      - name: Auto-Locate and Build APK
        run: |
          BUILD_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: No Gradle project files found in this repository."
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Found project directory at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/**/*.apk
